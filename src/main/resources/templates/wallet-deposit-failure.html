<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nạp tiền không thành công</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6fa;padding:24px;color:#172033">
<div style="max-width:560px;margin:auto;background:white;padding:32px;border-radius:12px">
  <h1 style="font-size:24px;color:#b91c1c">Nạp tiền không thành công</h1>
  <p>Yêu cầu <strong th:text="${reference}"></strong> đã bị từ chối sau khi đối soát. Tiền chưa được cộng vào ví từ yêu cầu này.</p>
  <p>Số tiền yêu cầu: <strong th:text="${amount}"></strong></p>
  <p>Lý do: <span th:text="${reviewNote}"></span></p>
  <p>Nếu bạn đã chuyển khoản, vui lòng liên hệ hỗ trợ và cung cấp mã yêu cầu cùng chứng từ chuyển khoản để kiểm tra.</p>
  <p><a th:href="${walletUrl}">Xem ví và lịch sử nạp tiền</a></p>
</div>
</body></html>
